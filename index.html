<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sınıf Dedikodusu</title>
<style>
:root{--bg:#070a12;--p:#0d1220;--c:#101727;--l:#202a40;--t:#f5f7ff;--m:#8992a8;--a:#8b7cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#182044,#070a12 40%);color:var(--t);font:15px Inter,system-ui,sans-serif}
header{height:76px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090d17e8;backdrop-filter:blur(15px);position:sticky;top:0;z-index:10}.logo{display:flex;gap:12px;align-items:center}.logoMark{font-size:30px}.logo b{font-size:20px}.logo small{display:block;color:var(--m);margin-top:2px}.code{border:1px solid var(--a);padding:10px 15px;border-radius:12px;font-weight:700}
.layout{display:grid;grid-template-columns:190px 1fr 360px;min-height:calc(100vh - 76px)}aside{border-right:1px solid var(--l);padding:22px 12px}.nav{padding:12px;border-radius:12px;color:#aeb6c9;margin:5px 0}.nav.active{background:#22274b;color:#fff}
main{padding:25px;max-width:1050px;width:100%;margin:auto}.search{width:100%;background:#0c1322;border:1px solid var(--l);border-radius:14px;padding:15px;color:white;outline:none;font-size:15px}.title{font-size:20px;font-weight:800;margin:25px 0 15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:15px}
.card{background:linear-gradient(180deg,#111a2b,#0d1421);border:1px solid var(--l);border-radius:16px;padding:16px;text-align:center;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#4e5e93}.avatar{width:82px;height:82px;border-radius:50%;margin:0 auto 12px;border:2px solid var(--a);display:grid;place-items:center;font-size:25px;font-weight:800;background:linear-gradient(135deg,#342a64,#173c63)}.card:nth-child(3n) .avatar{background:linear-gradient(135deg,#5c315b,#203e68)}.card:nth-child(4n) .avatar{background:linear-gradient(135deg,#2d526b,#403061)}
.name{font-weight:800;font-size:15px}.count{color:var(--m);font-size:12px;margin:6px}.open{width:100%;border:1px solid #6875d9;background:transparent;color:#d8d9ff;border-radius:10px;padding:9px;cursor:pointer}
.profile{border-left:1px solid var(--l);background:#090e19;padding:20px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}.profileTop{text-align:center;padding:10px 0 20px}.bigAvatar{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;margin:auto;border:2px solid var(--a);font-size:32px;font-weight:800;background:linear-gradient(135deg,#342a64,#173c63)}.profile h2{margin:12px 0 3px}.muted{color:var(--m);font-size:13px}.write,.send{margin-top:15px;background:#8b7cff;border:0;color:#fff;width:100%;padding:12px;border-radius:11px;font-weight:800;cursor:pointer}.commentsTitle{display:flex;justify-content:space-between;border-top:1px solid var(--l);padding-top:18px}.comment{padding:14px 0;border-bottom:1px solid var(--l);line-height:1.45}.anon{font-size:11px;color:#8790a5;margin-bottom:5px}textarea{width:100%;margin-top:15px;background:#0d1422;color:white;border:1px solid #303a52;border-radius:12px;padding:12px;resize:none;outline:none}.send{margin-top:8px;background:#5865e8}.note{font-size:11px;color:#717b91;margin-top:8px}.empty{padding:35px;text-align:center;color:var(--m)}
@media(max-width:1050px){.layout{grid-template-columns:70px 1fr}.profile{display:none}.grid{grid-template-columns:repeat(3,1fr)}aside .nav{font-size:0;text-align:center}}
@media(max-width:700px){header{padding:0 12px}.code{display:none}.layout{display:block}aside{display:none}main{padding:15px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:12px}.avatar{width:65px;height:65px;font-size:20px}}
</style></head><body>
<header><div class="logo"><span class="logoMark">💬</span><div><b>Sınıf Dedikodusu</b><small>Düşün, yaz, paylaş... (Anonim)</small></div></div><div class="code">Sınıf Kodu: 13KARDES</div></header>
<div class="layout"><aside><div class="nav active">👥 &nbsp;Tüm Öğrenciler</div><div class="nav">💬 &nbsp;Yorumlarım</div><div class="nav">ⓘ &nbsp;Hakkında</div></aside>
<main><input id="search" class="search" placeholder="Birini ara..."><div class="title">10/A — Öğrenciler</div><div id="grid" class="grid"></div></main>
<section class="profile" id="profile"><div class="empty">Bir profil seç.</div></section></div>
<script>
const names=["Dinmuhammet", "Eyup", "Şirgeldi", "Perman", "Süleyman", "Kerwen", "Gazak", "Amatly", "Davut🖤", "Hamza", "Sähet", "Seyfulla", "Didar"];const KEY="sinif_dedikodu_v1";let data=JSON.parse(localStorage.getItem(KEY)||"{}");names.forEach(n=>{if(!data[n])data[n]=[]});localStorage.setItem(KEY,JSON.stringify(data));let selected=names[0];
const initials=n=>n.replace("🖤","").trim().split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function renderGrid(){let q=document.getElementById("search").value.toLowerCase(),arr=names.filter(n=>n.toLowerCase().includes(q));document.getElementById("grid").innerHTML=arr.length?arr.map(n=>`<div class="card"><div class="avatar">${initials(n)}</div><div class="name">${esc(n)}</div><div class="count">💬 ${data[n].length} yorum</div><button class="open" onclick="selectPerson(${JSON.stringify(n)})">Profili Gör</button></div>`).join(""):`<div class="empty">Kimse bulunamadı.</div>`}
function selectPerson(n){selected=n;renderProfile()}
function renderProfile(){let comments=data[selected]||[];document.getElementById("profile").innerHTML=`<div class="profileTop"><div class="bigAvatar">${initials(selected)}</div><h2>${esc(selected)}</h2><div class="muted">💬 ${comments.length} anonim yorum</div><button class="write" onclick="document.getElementById('txt').focus()">💬 Yorum Yaz</button></div><div class="commentsTitle"><b>Yorumlar</b><span class="muted">En yeni</span></div><div>${comments.length?comments.slice().reverse().map(c=>`<div class="comment"><div class="anon">Anonim · ${new Date(c.t).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>${esc(c.text)}</div>`).join(""):`<div class="empty">Henüz yorum yok.</div>`}</div><textarea id="txt" rows="4" maxlength="300" placeholder="${esc(selected)} hakkında ne düşünüyorsun?"></textarea><button class="send" onclick="addComment()">Anonim Olarak Gönder</button><div class="note">Yorum bu tarayıcıda kaydedilir.</div>`}
function addComment(){let el=document.getElementById("txt"),text=el.value.trim();if(!text)return;data[selected].push({text,t:Date.now()});localStorage.setItem(KEY,JSON.stringify(data));renderGrid();renderProfile()}
document.getElementById("search").addEventListener("input",renderGrid);renderGrid();renderProfile();
</script></body></html>
