<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13 Kardeş</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f6ff;font:16px system-ui}header{text-align:center;padding:28px;background:linear-gradient(130deg,#171f3d,#39275b)}h1{margin:0;font-size:clamp(30px,7vw,44px)}.wrap{max-width:1000px;margin:auto;padding:16px}.muted{color:#aeb8d5;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab,.btn{border:0;border-radius:10px;padding:11px 14px;color:white;background:#7867f5;font:inherit;cursor:pointer;white-space:nowrap}.tab{background:#18213a;border:1px solid #303957}.tab.active{background:#7867f5}.panel{background:#141c31;border:1px solid #303957;border-radius:15px;padding:16px;margin:12px 0}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.student{background:#0e1629;color:white;border:1px solid #303957;border-radius:13px;padding:14px;cursor:pointer}.avatar{display:grid;place-items:center;margin:0 auto 8px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#7867f5,#b36be5);font-size:20px;font-weight:bold}.student.selected{border:2px solid #a79bff}input,textarea,select{width:100%;padding:12px;margin:7px 0;background:#0b1326;color:white;border:1px solid #303957;border-radius:10px;font:inherit}.item{background:#0b1326;border:1px solid #303957;border-radius:11px;padding:12px;margin:9px 0;overflow-wrap:anywhere}.item p{white-space:pre-wrap}.smallbtn{font-size:13px;padding:7px 10px}.status{color:#c9c5ff;font-size:13px}.option{display:flex;gap:8px;align-items:center;margin:8px 0}.option input{width:auto}.bar{height:5px;background:#303957}.bar span{display:block;height:5px;background:#7867f5}footer{text-align:center;color:#aeb8d5;font-size:12px;padding:20px}
</style></head><body><header><h1>13 Kardeş 🤝</h1><p class="muted">Sınıfımızın kendi köşesi</p></header><main class="wrap"><p class="panel muted">Saygılı ol. Bu sitede gerçek kimlik doğrulaması yoktur; özel bilgilerini paylaşma.</p><nav class="tabs"><button class="tab active" data-tab="studentsTab">👥 Öğrenciler</button><button class="tab" data-tab="commentsTab">💬 Yorumlar</button><button class="tab" data-tab="postsTab">📌 Sınıf panosu</button><button class="tab" data-tab="pollsTab">📊 Anketler</button><button class="tab" data-tab="profileTab">✏️ Profil</button></nav>
<section class="panel" id="studentsTab"><h2>Öğrenciler</h2><p class="muted">Bir öğrenciyi seçerek yorumlarını aç.</p><div id="students" class="grid"></div></section>
<section class="panel hidden" id="commentsTab"><h2 id="commentTitle">Yorumlar</h2><input id="commentName" maxlength="60" placeholder="Adın veya Anonim"><textarea id="commentText" maxlength="300" rows="3" placeholder="Yorum yaz..."></textarea><button class="btn" id="sendComment">Yorumu gönder</button><p class="status" id="commentStatus"></p><div id="comments"></div></section>
<section class="panel hidden" id="postsTab"><h2>Sınıf panosu</h2><input id="postName" maxlength="60" placeholder="Adın veya Anonim"><textarea id="postText" maxlength="1000" rows="3" placeholder="Sınıfla paylaş..."></textarea><button class="btn" id="sendPost">Paylaş</button><p class="status" id="postStatus"></p><div id="posts"></div></section>
<section class="panel hidden" id="pollsTab"><h2>Anketler</h2><input id="pollName" maxlength="60" placeholder="Adın veya Anonim"><input id="pollQuestion" maxlength="250" placeholder="Anket sorusu"><input id="opt1" maxlength="120" placeholder="1. seçenek"><input id="opt2" maxlength="120" placeholder="2. seçenek"><input id="opt3" maxlength="120" placeholder="3. seçenek (isteğe bağlı)"><button class="btn" id="createPoll">Anket oluştur</button><p class="status" id="pollStatus"></p><div id="polls"></div></section>
<section class="panel hidden" id="profileTab"><h2>Profil açıklaması</h2><select id="profileName"></select><textarea id="bio" maxlength="250" rows="3" placeholder="Kısa açıklama"></textarea><button class="btn" id="saveBio">Kaydet</button><p class="status" id="bioStatus"></p></section></main><footer>13 Kardeş · Kişisel bilgilerini paylaşma.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const URL='https://xjuojpsjjxibasdfcrhs.supabase.co',KEY='sb_publishable_Mq5b0Ov7_786zHo1QwceNQ_S_Y5bO4t',db=window.supabase?.createClient(URL,KEY);const names=['Dinmuhammet','Eyup','Şirgeldi','Perman','Süleyman','Kerwen','Gazak','Amatly','Davut🖤','Hamza','Sähet','Seyfulla','Didar'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let chosen=names[0];let voter;try{voter=localStorage.getItem('13kvoter')||crypto.randomUUID();localStorage.setItem('13kvoter',voter)}catch{voter='visitor'+Math.random()}
function msg(id,s){$(id).textContent=s}function tab(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));['studentsTab','commentsTab','postsTab','pollsTab','profileTab'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='commentsTab')loadComments();if(id==='postsTab')loadPosts();if(id==='pollsTab')loadPolls();if(id==='profileTab')loadBio()}
document.querySelector('.tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)tab(b.dataset.tab)};
$('students').innerHTML=names.map(n=>`<button class="student" data-name="${esc(n)}"><span class="avatar">${esc([...n][0])}</span>${esc(n)}</button>`).join('');$('profileName').innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join('');
$('students').onclick=e=>{let b=e.target.closest('[data-name]');if(!b)return;chosen=b.dataset.name;document.querySelectorAll('.student').forEach(x=>x.classList.toggle('selected',x===b));$('commentTitle').textContent=chosen+' için yorumlar';$('profileName').value=chosen;tab('commentsTab')};
async function loadComments(){if(!db)return;let {data,error}=await db.from('comments').select('*').eq('student_name',chosen).order('created_at',{ascending:false}).limit(60);$('comments').innerHTML=error?'<p class="muted">Yüklenemedi. SQL kodunu bu projede çalıştır.</p>':(data||[]).map(c=>`<div class="item"><b>${esc(c.student_name)}</b><p>${esc(c.comment)}</p><span class="muted">${new Date(c.created_at).toLocaleString()}</span></div>`).join('')||'<p class="muted">Henüz yorum yok.</p>'}
$('sendComment').onclick=async()=>{if(!db)return msg('commentStatus','Supabase bağlantısı yok.');let comment=$('commentText').value.trim(),student_name=$('commentName').value.trim()||'Anonim';if(!comment)return msg('commentStatus','Yorumunu yaz.');let {error}=await db.from('comments').insert({student_name,comment});if(error)return msg('commentStatus','Hata: '+error.message);$('commentText').value='';msg('commentStatus','Yorum gönderildi.');loadComments()};
async function loadPosts(){if(!db)return;let {data,error}=await db.from('class_posts').select('*').order('created_at',{ascending:false}).limit(60);$('posts').innerHTML=error?'<p class="muted">Pano için SQL tablolarını oluştur.</p>':(data||[]).map(p=>`<div class="item"><b>${esc(p.student_name)}</b><p>${esc(p.content)}</p><span class="muted">${new Date(p.created_at).toLocaleString()}</span></div>`).join('')||'<p class="muted">Henüz paylaşım yok.</p>'}
$('sendPost').onclick=async()=>{if(!db)return;let content=$('postText').value.trim(),student_name=$('postName').value.trim()||'Anonim';if(!content)return msg('postStatus','Mesaj yaz.');let {error}=await db.from('class_posts').insert({student_name,content});if(error)return msg('postStatus','Hata: '+error.message);$('postText').value='';msg('postStatus','Paylaşıldı.');loadPosts()};
async function loadPolls(){if(!db)return;let {data,error}=await db.from('class_polls').select('*').order('created_at',{ascending:false}).limit(40);if(error){$('polls').innerHTML='<p class="muted">Anket tabloları için SQL kodunu çalıştır.</p>';return}let html='';for(let p of data||[]){let {data:o}=await db.from('poll_options').select('*').eq('poll_id',p.id),{data:v}=await db.from('poll_votes').select('option_id').eq('poll_id',p.id),{data:mine}=await db.from('poll_votes').select('id').eq('poll_id',p.id).eq('voter_id',voter);let total=(v||[]).length;html+=`<div class="item"><b>${esc(p.question)}</b><p class="muted">${esc(p.student_name)} · ${new Date(p.created_at).toLocaleString()}</p>${(o||[]).map(a=>{let count=(v||[]).filter(x=>x.option_id===a.id).length,pct=total?Math.round(count/total*100):0;return `<label class="option"><input type="radio" name="poll${p.id}" value="${a.id}" ${mine?.length?'disabled':''}><span style="flex:1">${esc(a.option_text)}<div class="bar"><span style="width:${pct}%"></span></div></span><span class="muted">${count} (${pct}%)</span></label>`}).join('')}${mine?.length?'<p class="muted">Oy kullandın.</p>':`<button class="btn smallbtn" data-vote="${p.id}">Oy ver</button>`}</div>`}$('polls').innerHTML=html||'<p class="muted">Henüz anket yok.</p>'}
$('createPoll').onclick=async()=>{if(!db)return;let question=$('pollQuestion').value.trim(),student_name=$('pollName').value.trim()||'Anonim',options=[$('opt1').value.trim(),$('opt2').value.trim(),$('opt3').value.trim()].filter(Boolean);if(!question||options.length<2)return msg('pollStatus','Soru ve en az iki seçenek gerekli.');let {data,error}=await db.from('class_polls').insert({question,student_name}).select('id').single();if(error)return msg('pollStatus','Hata: '+error.message);let r=await db.from('poll_options').insert(options.map(option_text=>({poll_id:data.id,option_text})));if(r.error)return msg('pollStatus','Seçenek hatası: '+r.error.message);['pollQuestion','opt1','opt2','opt3'].forEach(id=>$(id).value='');msg('pollStatus','Anket oluşturuldu.');loadPolls()};
$('polls').onclick=async e=>{let b=e.target.closest('[data-vote]');if(!b)return;let id=Number(b.dataset.vote),choice=document.querySelector(`input[name="poll${id}"]:checked`);if(!choice)return msg('pollStatus','Önce bir seçenek seç.');let {error}=await db.from('poll_votes').insert({poll_id:id,option_id:Number(choice.value),voter_id:voter});if(error)return msg('pollStatus','Oy kaydedilemedi: '+error.message);msg('pollStatus','Oyun kaydedildi.');loadPolls()};
async function loadBio(){if(!db)return;let n=$('profileName').value,{data,error}=await db.from('student_profiles').select('bio').eq('student_name',n).maybeSingle();$('bio').value=error?'':data?.bio||''}
$('profileName').onchange=loadBio;$('saveBio').onclick=async()=>{if(!db)return;let student_name=$('profileName').value,bio=$('bio').value.trim();let {error}=await db.from('student_profiles').upsert({student_name,bio,updated_at:new Date().toISOString()},{onConflict:'student_name'});msg('bioStatus',error?'Kaydedilemedi: '+error.message:'Profil kaydedildi.')};
})();
</script></body></html>
